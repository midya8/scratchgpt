[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scratchgpt"
version = "0.3.0"
description = "A GPT built and trained from scratch in pure NumPy. No PyTorch, no JAX: one tiny autograd engine, hand-written backprop, and a real trained model."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["scratchgpt"]
